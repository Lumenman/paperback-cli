name: CI
on:
  # Branches only: a pushed tag is a commit already checked, and its release
  # runs the jobs again anyway. Notes and README changes build nothing.
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  # Publishing a release builds, tests and attaches both binaries to it.
  release:
    types: [published]
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [check, sanitize]
    steps:
      - uses: actions/checkout@v4
      # check links statically on every push, so the release binary is the
      # one the tests ran on and does not care which glibc it lands on.
      - run: make ${{ matrix.target }} ${{ matrix.target == 'check' && 'LDFLAGS=-static' || '' }}
      - if: github.event_name == 'release' && matrix.target == 'check'
        run: |
          cp paperback-cli paperback-cli-linux-x86_64
          gh release upload "$TAG" paperback-cli-linux-x86_64 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
          # The Makefile runs the tests with the runner's Windows python.
          path-type: inherit
      - run: make check
      - if: github.event_name == 'release'
        shell: pwsh
        run: gh release upload "$env:TAG" paperback-cli.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
