name: CI
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [check, sanitize]
    steps:
      - uses: actions/checkout@v4
      - run: make ${{ matrix.target }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
          # The Makefile runs the tests with the runner's Windows python.
          path-type: inherit
      - run: make check
